services:
  # Backend — Flask API
  - type: web
    name: phishguard-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: SECRET_KEY
        generateValue: true        # Render auto-generates a secure key
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        value: ""
      - key: PHISHTANK_API_KEY
        value: ""
      - key: FLASK_ENV
        value: production
    healthCheckPath: /api/health

  # Frontend — React via Nginx
  - type: web
    name: phishguard-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: BACKEND_URL
        fromService:
          name: phishguard-backend
          type: web
          property: host